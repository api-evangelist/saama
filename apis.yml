aid: saama
name: Saama
description: >-
  Saama (Saama Technologies, Inc.) is a Campbell, California life-sciences technology company
  that builds AI-powered clinical analytics software for biopharmaceutical sponsors and CROs.
  Its platform ingests, curates and animates clinical trial data through products including the
  Data Hub, Smart Data Quality (SDQ), Operational Insights, Patient Insights, Source to
  Submission (S2S) and the BRAIN family (BRAIN SDTM, BRAIN SCE, BRAIN Visualization, BRAIN
  Consortium), alongside a set of modular Clinical AI Agents announced in 2025. Saama states its
  platform offers 40-plus pre-built connectors and that its agents are "connected via APIs", but
  as of this profile the company publishes no public developer portal, API reference or
  machine-readable specification - technical documentation and the support portal both sit behind
  a customer login.
